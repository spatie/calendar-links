name: Psalm

on:
  pull_request:
    paths:
      - '**.php'
      - 'psalm*'
      - 'composer.*'
      - '.github/workflows/psalm.yml'
  push:
    paths:
      - '**.php'
      - 'psalm*'
      - 'composer.*'
      - '.github/workflows/psalm.yml'

jobs:
  psalm:
    name: psalm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Run composer install
        run: composer install -n --prefer-dist

      - name: Run Psalm
        run: composer psalm
